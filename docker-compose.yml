version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: ai_knowledge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_in_production_run_secrets_token_hex_32}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:////app/data/app.db
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - CHROMA_COLLECTION_NAME=ai_knowledge_assistant
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - UPLOAD_DIR=/app/data/uploads
      - MAX_UPLOAD_SIZE_MB=15
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Named persistent volumes for SQLite, ChromaDB, and HuggingFace model cache
      - rag_sqlite_data:/app/data
      - rag_chroma_data:/app/chroma_data
      - rag_model_cache:/home/appuser/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: ai_knowledge_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag_network

volumes:
  rag_sqlite_data:
    name: rag_sqlite_data
  rag_chroma_data:
    name: rag_chroma_data
  rag_model_cache:
    name: rag_model_cache

networks:
  rag_network:
    driver: bridge
